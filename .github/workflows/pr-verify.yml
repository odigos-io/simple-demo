name: Verify Docker Builds

on:
  pull_request:
    branches: [ main ]

permissions:
  contents: read
  id-token: write # OIDC auth to the Depot builder

env:
  DEPOT_PROJECT_ID: 8t6kgh87dd
  # Pin every buildx call to the Depot builder. The app Makefiles run
  # `docker buildx create --use multibuilder`; BUILDX_BUILDER takes precedence over that.
  BUILDX_BUILDER: depot_8t6kgh87dd

jobs:
  build-packages:
    strategy:
      fail-fast: false
      matrix:
        service:
          - coupon
          - currency
          - frontend
          - geolocation
          - inventory
          - membership
          - pricing
          - load-generator
    runs-on: depot-ubuntu-24.04-4
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          fetch-depth: 1

      # Installs the depot CLI and registers the depot_<project> buildx builder
      # (native amd64 + arm64 nodes, so QEMU is not needed).
      - name: Set up Depot builder
        uses: depot/use-action@v1
        with:
          project: ${{ env.DEPOT_PROJECT_ID }}

      - name: Build and package ${{ matrix.service }}
        working-directory: ${{ matrix.service }}
        run: make -j package-all build-all

      - name: Upload deb artifacts
        uses: actions/upload-artifact@v7
        with:
          name: packages-${{ matrix.service }}-deb
          path: ${{ matrix.service }}/bin/*.deb

      - name: Upload rpm artifacts
        uses: actions/upload-artifact@v7
        with:
          name: packages-${{ matrix.service }}-rpm
          path: ${{ matrix.service }}/bin/*.rpm
